[package]
name = "fete-core"
description = "Framework layer for GPU visuals: show clock, modulation, palettes, fullscreen and compute scaffolding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
# Re-compile WGSL from disk while the app is running. Enable on the whole
# workspace with `cargo run --features fete-core/hot-shaders`.
hot-shaders = ["bevy/embedded_watcher"]
