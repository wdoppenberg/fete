; Four apps, one project. `-e transmitter` is the board with the buttons on it;
; `-e receiver` is the one on the laptop's USB.
;
;   pio run -e transmitter -t upload
;   pio run -e receiver    -t upload
;
; Both boards are ESP32-S3-N16R8: 16 MB flash, 8 MB octal PSRAM. The
; `qio_opi` memory type is what makes an octal-PSRAM module boot; with the
; default the board resets in a loop and the cause is not obvious.

[env]
; Exact pin: PlatformIO warns that the floating name makes two checkouts build
; against different Arduino cores and toolchains as soon as a release lands.
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Make `Serial` the native USB CDC port rather than the UART bridge, so the
; port you plug into is the port that talks. Your board has two USB-C sockets;
; this is the one wired to the chip itself.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:transmitter]
build_src_filter = +<transmitter/>

; Flash this one first: it reports which GPIO each button is on, so the tables
; in include/panel_config.h describe your wiring rather than my guess.
[env:discover]
build_src_filter = +<discover/>

; The other half of discovery. `discover` watches pins and finds the buttons;
; this one drives pins and finds the LEDs, which is the only way round that
; works for an output. Run it when LED_PINS is still all -1.
[env:led-discover]
build_src_filter = +<led-discover/>

[env:receiver]
build_src_filter = +<receiver/>
; This board's native USB socket is dead — no power, nothing on the bus — so
; `Serial` has to leave over UART0 and through the CH343 bridge on the other
; socket instead. `ARDUINO_USB_CDC_ON_BOOT=0` is what moves it there; the
; global flag above would otherwise point it at the port that does not work.
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
