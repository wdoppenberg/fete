name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole file before it builds anything, so a
  # tag can only turn into binaries if every gate below is green.
  workflow_call:

# A second push to the same branch makes the first run's answer irrelevant.
# Tags are exempt: a release run cancelling itself would be a nasty surprise.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI compiles each crate exactly once; incremental state is pure cache weight.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Registry dependencies are compiled with `--cap-lints allow`, so this denies
  # warnings in this workspace only.
  RUSTFLAGS: -D warnings
  # Nothing here opens a debugger, and debug info is most of the bulk: every
  # visual crate is its own Bevy binary, and with symbols the workspace's debug
  # artifacts run to tens of gigabytes — more than a runner's disk holds. The
  # test profile inherits dev, but both are set because only one of them is
  # obvious.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS rather than per job: clippy, rustdoc and the tests
          # compile the same dependency tree, and three separate multi-gigabyte
          # entries crowd the repository's 10 GB cache budget until everything
          # starts getting evicted.
          shared-key: dev-${{ runner.os }}
          # Only the default branch writes. A cache is scoped to the ref that
          # created it, so a tag or PR writing one spends the shared budget on
          # something no other ref can ever read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # `--all-targets` reaches tests, benches and examples; `--locked` fails
      # rather than quietly rewriting Cargo.lock.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS rather than per job: clippy, rustdoc and the tests
          # compile the same dependency tree, and three separate multi-gigabyte
          # entries crowd the repository's 10 GB cache budget until everything
          # starts getting evicted.
          shared-key: dev-${{ runner.os }}
          # Only the default branch writes. A cache is scoped to the ref that
          # created it, so a tag or PR writing one spends the shared budget on
          # something no other ref can ever read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Private items too: most of this workspace is internal, and a broken
      # intra-doc link there is still a broken link.
      - run: cargo doc --workspace --all-features --no-deps --document-private-items --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS rather than per job: clippy, rustdoc and the tests
          # compile the same dependency tree, and three separate multi-gigabyte
          # entries crowd the repository's 10 GB cache budget until everything
          # starts getting evicted.
          shared-key: dev-${{ runner.os }}
          # Only the default branch writes. A cache is scoped to the ref that
          # created it, so a tag or PR writing one spends the shared budget on
          # something no other ref can ever read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # The runner ships with Android, .NET and GHC toolchains none of this
      # needs, and linking eight Bevy binaries wants the space more than they
      # do. Without this the linker dies on a full disk, which it reports as a
      # bus error rather than anything resembling ENOSPC.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Not `--all-targets`: every crate's binary already gets linked here as
      # its own test harness, and `--all-targets` links each one a second time
      # as a plain binary for no extra coverage.
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check

  # The release workflow's builds are the slowest thing in this repository and
  # they can never warm themselves: a cache belongs to the ref that wrote it, so
  # what `v0.1.0` builds is unreadable to `v0.2.0`, and only the default
  # branch's caches are visible to every ref. Nothing else here compiles the
  # release profile — with thin LTO and one codegen unit it is a different, far
  # slower build than the tests — so master compiles it once and leaves the
  # result where a tag can pick it up. This gates nothing; it is a cache, and it
  # is deliberately absent from the roll-up below.
  release-cache:
    name: warm release cache (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Must match the key the release workflow restores with.
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p fete-show --target ${{ matrix.target }}

  # Single required check for branch protection: it fails if anything above
  # failed or was skipped, so adding a job to the matrix never silently
  # loosens the gate.
  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, docs, test, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(", ")' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::these jobs did not succeed: $failed"
            exit 1
          fi
